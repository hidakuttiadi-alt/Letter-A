<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1670 1820" width="1670" height="1820">
  <defs>
    <path id="diamond-shape" d="M -11.53 -125.18 Q 0.00 -139.00 11.53 -125.18 Q 78.88 -94.52 104.47 -13.82 Q 116.00 0.00 104.47 13.82 Q 78.88 94.52 11.53 125.18 Q 0.00 139.00 -11.53 125.18 Q -78.88 94.52 -104.47 13.82 Q -116.00 0.00 -104.47 -13.82 Q -78.88 -94.52 -11.53 -125.18 Z" />
    <filter id="tile-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Background rounded rectangle -->
  <rect x="0" y="0" width="1670" height="1820" rx="260" ry="260" fill="#A4D6D9" />

  <!-- 10 Diamond Tiles -->
  <g id="diamond-grid">
    <g transform="translate(484, 404)" filter="url(#tile-shadow)">
      <use href="#diamond-shape" fill="#DD2427" />
    </g>
    <g transform="translate(1186, 404)" filter="url(#tile-shadow)">
      <use href="#diamond-shape" fill="#FFFFFF" />
    </g>
    <g transform="translate(484, 687)" filter="url(#tile-shadow)">
      <use href="#diamond-shape" fill="#DD2427" />
    </g>
    <g transform="translate(718, 687)" filter="url(#tile-shadow)">
      <use href="#diamond-shape" fill="#DD2427" />
    </g>
    <g transform="translate(952, 687)" filter="url(#tile-shadow)">
      <use href="#diamond-shape" fill="#FFFFFF" />
    </g>
    <g transform="translate(1186, 687)" filter="url(#tile-shadow)">
      <use href="#diamond-shape" fill="#FFFFFF" />
    </g>
    <g transform="translate(484, 970)" filter="url(#tile-shadow)">
      <use href="#diamond-shape" fill="#24743C" />
    </g>
    <g transform="translate(718, 970)" filter="url(#tile-shadow)">
      <use href="#diamond-shape" fill="#24743C" />
    </g>
    <g transform="translate(952, 970)" filter="url(#tile-shadow)">
      <use href="#diamond-shape" fill="#24743C" />
    </g>
    <g transform="translate(1186, 970)" filter="url(#tile-shadow)">
      <use href="#diamond-shape" fill="#24743C" />
    </g>
  </g>

  <!-- Typography -->
  <g id="logo-text" text-anchor="middle" fill="#333130">
    <!-- SAMASTHA -->
    <text x="835" y="1255" font-family="'Montserrat', 'Inter', 'Segoe UI', sans-serif" font-weight="900" font-size="118" letter-spacing="14">SAMASTHA</text>
    
    <!-- CENTENARY -->
    <text x="835" y="1395" font-family="'Montserrat', 'Inter', 'Segoe UI', sans-serif" font-weight="900" font-size="108" letter-spacing="18">CENTENARY</text>
    
    <!-- • 100 പ്രകാശ വർഷങ്ങൾ • -->
    <text x="835" y="1520" font-family="'Noto Sans Malayalam', 'Manjari', 'Gayathri', sans-serif" font-weight="700" font-size="58" letter-spacing="6">• 100 പ്രകാശ വർഷങ്ങൾ •</text>
  </g>
</svg>